name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run Biome check
        run: npm run check

      - name: Run unit tests
        run: npm test -- --run
        env:
          CI: true

      - name: Run Firestore rules emulator test
        run: npx --no-install firebase emulators:exec --project demo-textify --only firestore "npm run test:rules"

      - name: Build project
        run: npm run build

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Run security audit
        run: npm audit --omit=dev

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
